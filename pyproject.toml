[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-loan-repossession-risk"
version = "0.1.0"
description = "Portfolio project: delinquency transitions and repossession risk on synthetic auto loans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.11",
    "lifelines>=0.28",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
notebooks = ["jupyter", "nbconvert", "ipykernel", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
repo-risk = "repo_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402", "E501", "UP037"]
